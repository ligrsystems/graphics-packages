{
  "name": "Code graphics or SDK/CLI feature, question, or concern",
  "description": "Suggest an improvement or discuss code-based graphics, the SDK, CLI, or code graphics examples or instructions.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use this form for code graphics, SDK, CLI, or package download topics, including examples or instructions.\nFor account, login, billing, or general application and website problems, use the [LIGR Help Center](https://help.ligr.live/en/).\nIssues are public. Do not include API keys, login credentials, or customer data.\n\nAn automated check closes incomplete or explicitly out-of-scope issues with an explanation. Edit the issue to complete the form and the check will reopen it. Maintainers can override the check. This saves developer time; it is not a penalty for reporting problems.\n"
      }
    },
    {
      "type": "checkboxes",
      "id": "scope",
      "attributes": {
        "label": "Issue scope",
        "options": [
          {
            "label": "This issue concerns code-based graphics, the graphics SDK, CLI, or code graphics examples or instructions.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "dropdown",
      "id": "area",
      "attributes": {
        "label": "Affected area",
        "options": [
          "Code-based graphics",
          "Graphics SDK",
          "CLI",
          "Package downloads or installation",
          "Code graphics examples or instructions",
          "General application, account, or website"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "topic",
      "attributes": {
        "label": "Topic",
        "options": ["Feature request", "Question", "Concern"]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "What are you trying to do?",
        "description": "Explain the code graphics, SDK, or CLI workflow and the problem or question."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "outcome",
      "attributes": {
        "label": "Requested outcome",
        "description": "Describe the improvement or answer you need. Include alternatives you have tried when relevant."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "Additional details",
        "description": "Include relevant package versions, documentation links, or small code examples. Remove credentials and customer data."
      }
    }
  ]
}
